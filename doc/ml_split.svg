<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Training and test data split</title>
  <desc id="desc">A two-column X and y data table is split into a two-by-two table containing X_train, y_train, X_test, and y_test.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0,0 L 12,6 L 0,12 z" fill="#231f20"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#fff"/>

  <!-- Original feature/target table -->
  <rect x="120" y="100" width="420" height="800" rx="10" fill="none" stroke="#231f20" stroke-width="7"/>
  <line x1="400" y1="110" x2="400" y2="890" stroke="#231f20" stroke-width="4" stroke-linecap="round"/>
  <text x="260" y="510" font-family="Arial, Helvetica, sans-serif" font-size="48" text-anchor="middle" dominant-baseline="middle">X</text>
  <text x="470" y="510" font-family="Arial, Helvetica, sans-serif" font-size="48" text-anchor="middle" dominant-baseline="middle">y</text>

  <!-- Split arrow -->
  <line x1="540" y1="510" x2="940" y2="510" stroke="#231f20" stroke-width="7" marker-end="url(#arrowhead)"/>

  <!-- Train/test tables -->
  <rect x="950" y="100" width="430" height="800" rx="10" fill="none" stroke="#231f20" stroke-width="7"/>
  <line x1="1230" y1="110" x2="1230" y2="890" stroke="#231f20" stroke-width="4" stroke-linecap="round"/>
  <line x1="960" y1="650" x2="1370" y2="650" stroke="#231f20" stroke-width="4" stroke-linecap="round"/>

  <!-- Deliberately smaller labels, centered inside each cell with clear margins. -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="34" text-anchor="middle" dominant-baseline="middle">
    <text x="1090" y="375">X_train</text>
    <text x="1305" y="375">y_train</text>
    <text x="1090" y="775">X_test</text>
    <text x="1305" y="775">y_test</text>
  </g>
</svg>
